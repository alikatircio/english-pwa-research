name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      # Job level, so every content:build in the job sees it (C9 fails on CI without it).
      PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build content
        run: npm run content:build

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        timeout-minutes: 12
        run: npx playwright install --with-deps webkit chromium

      - run: npm run test:e2e

      - name: Upload Playwright traces and report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
